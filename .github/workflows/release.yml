name: Create Release
on:
  push:
    tags: '*'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Zip
        run: cd dist && zip -r conditioner.zip ./*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/conditioner.zip